name: kh-debug-mcp
# MCP and AuthGate run by default; optional disposable user-agent container for real shell tests.
# The AuthGate is the ONLY path between MCP and the user diagnostic agent.
# Test-only full 64 hex master in Auth; 32 A hex in MCP; 32 B hex in user.
services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    image: kh-debug-auth:local
    restart: unless-stopped
    networks:
      - mcp_auth
      - auth_agent
    ports:
      # Keep loopback-only. Use a secure private proxy for a remote client.
      - "${KH_AUTH_HOST_BIND:-127.0.0.1}:41371:41371"
    environment:
      KH_AUTH_BIND: "0.0.0.0:41371"
      KH_AUTH_STATE_DIR: "/auth/state"
      KH_AUTH_API_TOKEN_FILE: "/auth/state/auth_api_token"
      KH_AUTH_MCP_TOKEN_FILE: "/service/token"
      KH_AUTH_MCP_A_HALF_URL: "http://mcp:41370/internal/a-half"
      KH_AUTH_MASTER_SHA256_FILE: "/opt/kh-auth/test-master.sha256"
      KH_AUTH_LEASE_SECONDS: "${KH_AUTH_LEASE_SECONDS:-300}"
    volumes:
      - auth_state:/auth/state
      - mcp_auth_service:/service
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:41371/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  mcp:
    # Allow access only to AuthGate-created internal service token (GID 10003).
    group_add: ["10003"]
    build:
      context: .
      dockerfile: Dockerfile
    image: kh-debug-mcp:local
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mcp_auth
    ports:
      - "127.0.0.1:41370:41370"
    environment:
      KH_DEBUG_BIND: "0.0.0.0:41370"
      KH_DEBUG_ALLOWED_HOSTS: "localhost:41370,127.0.0.1:41370"
      KH_DEBUG_IMAGE_DIR: "/data/screenshots"
      KH_DEBUG_A_HALF_FILE: "/opt/kh-debug/a-half.txt"
      KH_DEBUG_SERVICE_TOKEN_FILE: "/service/token"
      KH_DEBUG_AUTH_RELAY_URL: "http://auth:41371/relay/command"
    volumes:
      - screenshots:/data/screenshots
      - mcp_auth_service:/service:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    healthcheck:
      test: ["CMD", "pwsh", "-NoProfile", "-Command", "if ((Invoke-WebRequest http://127.0.0.1:41370/health).StatusCode -eq 200) { exit 0 } else { exit 1 }"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  agent:
    profiles: ["test-agent"]
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: kh-debug-agent:local
    depends_on:
      mcp:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: "no"
    networks:
      - auth_agent
    environment:
      KH_AGENT_AUTH_URL: "http://auth:41371"
      KH_AGENT_USER: "testagent"
      KH_AGENT_B_HALF_FILE: "/agent/b-half.txt"
      KH_AGENT_SHELL: "sh"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m

networks:
  mcp_auth:
  auth_agent:

volumes:
  screenshots:
    name: kh-debug-mcp-screenshots
  auth_state:
    name: kh-debug-auth-state
  mcp_auth_service:
    name: kh-debug-service-auth
