[package]
name = "kh-debug-mcp"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Minimal Rust Streamable HTTP MCP server for local Windows PowerShell"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[dev-dependencies]
tower = "0.5"