name: Docker three-container AuthGate relay test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose with optional test agent
        run: docker compose --profile test-agent config --quiet
      - name: Start MCP, AuthGate, and real user agent
        run: |
          set -euo pipefail
          docker compose --profile test-agent up -d --build
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:41370/health >/dev/null 2>&1 &&
               curl -fsS http://127.0.0.1:41371/health >/dev/null 2>&1 &&
               docker compose --profile test-agent logs --no-color agent | grep -q 'AUTH_APPROVED'; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:41370/health
          curl -fsS http://127.0.0.1:41371/health
          docker compose --profile test-agent logs --no-color agent | grep 'AUTH_APPROVED'
          docker compose --profile test-agent ps
      - name: Verify three separately mounted literal credential halves
        run: |
          set -euo pipefail
          docker compose --profile test-agent exec -T auth sh -c 'test -r /opt/kh-auth/test-master.sha256; test ! -e /opt/kh-debug/a-half.txt && test ! -e /agent/b-half.txt'
          docker compose --profile test-agent exec -T mcp sh -c 'test -r /opt/kh-debug/a-half.txt; test ! -e /opt/kh-auth/test-master.sha256 && test ! -e /agent/b-half.txt'
          docker compose --profile test-agent exec -T agent sh -c 'test -r /agent/b-half.txt; test ! -e /opt/kh-auth/test-master.sha256 && test ! -e /opt/kh-debug/a-half.txt'
          test "$(cat tests/fixtures/a-half.txt tests/fixtures/b-half.txt | tr -d '\n')" = "$(tr -d '\n' < tests/fixtures/master.sha256)"
          echo MASTER_IN_AUTH_A_IN_MCP_B_IN_USER=PASS
      - name: Verify user-agent is network-isolated from MCP
        run: |
          set -euo pipefail
          docker compose --profile test-agent exec -T agent sh -c '
            if getent hosts mcp >/dev/null 2>&1 || curl -fsS --max-time 2 http://mcp:41370/health >/dev/null 2>&1; then
              echo "FAIL: user agent can reach MCP directly"; exit 1
            fi
            echo "AGENT_TO_MCP_DIRECT=BLOCKED"
          '
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
             -H 'Content-Type: application/json' -d '{}' \
             http://127.0.0.1:41370/agent/login)
          test "$status" = 404
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
             -H 'Content-Type: application/json' -d '{"user_id":"wrong","b_half":"ffffffffffffffffffffffffffffffff"}' \
             http://127.0.0.1:41371/agent/login)
          test "$status" = 401
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
             -H 'Content-Type: application/json' -d '{"command":"echo BYPASS"}' \
             http://127.0.0.1:41371/relay/command)
          test "$status" = 401
      - name: Actually execute /bin/sh script inside user container through MCP
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:41370/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"run_remote_shell","arguments":{"command":"sh /opt/kh-agent/diagnostic.sh; printf EXECUTED_BY_REMOTE_SHELL > /tmp/kh-proof; cat /tmp/kh-proof","target_user":"testagent","timeout_seconds":20}}}' \
            > "$RUNNER_TEMP/shell-response.json"
          grep -q 'USER_CONTAINER_SHELL_OK' "$RUNNER_TEMP/shell-response.json"
          grep -q 'B_HALF_PRESENT' "$RUNNER_TEMP/shell-response.json"
          grep -q 'EXECUTED_BY_REMOTE_SHELL' "$RUNNER_TEMP/shell-response.json"
          grep -q '"isError":false' "$RUNNER_TEMP/shell-response.json"
          docker compose --profile test-agent exec -T agent sh -c 'test "$(cat /tmp/kh-proof)" = EXECUTED_BY_REMOTE_SHELL'
          echo 'MCP_AUTHGATE_REAL_CONTAINER_SHELL=PASS'
      - name: Reject Windows PowerShell tool on Linux-only agent
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:41370/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":8,"method":"tools/call","params":{"name":"run_remote_powershell","arguments":{"command":"Write-Output MUST_NOT_RUN","target_user":"testagent","timeout_seconds":10}}}' \
            > "$RUNNER_TEMP/wrong-shell.json"
          grep -q 'Shell type not permitted' "$RUNNER_TEMP/wrong-shell.json"
          grep -q '"isError":true' "$RUNNER_TEMP/wrong-shell.json"
      - name: AuthGate stop blocks remote shell while MCP stays online
        run: |
          set -euo pipefail
          docker compose --profile test-agent stop auth
          curl -fsS http://127.0.0.1:41370/health >/dev/null
          curl -fsS http://127.0.0.1:41370/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":9,"method":"tools/call","params":{"name":"run_remote_shell","arguments":{"command":"printf MUST_NOT_RUN > /tmp/after-auth-stop","target_user":"testagent"}}}' \
            > "$RUNNER_TEMP/blocked.json"
          grep -q 'AuthGate unavailable' "$RUNNER_TEMP/blocked.json"
          docker compose --profile test-agent exec -T agent sh -c 'test ! -e /tmp/after-auth-stop' || \
            docker compose --profile test-agent logs --tail=25 agent
          echo 'AUTHGATE_SHUTDOWN_BLOCKS_REMOTE_SHELL=PASS'
      - name: Show logs on failure
        if: failure()
        run: docker compose --profile test-agent logs --tail=120 --no-color
      - name: Delete ephemeral CI volumes
        if: always()
        run: docker compose --profile test-agent down -v --remove-orphans
